# Builds, tests and packs on pushes to main. Publishing is publish.yml, run by hand.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      # The tests run against PostgreSQL in Testcontainers; the Ubuntu runner has Docker.
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/
